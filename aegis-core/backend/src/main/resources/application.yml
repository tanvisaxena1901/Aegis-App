spring:
  application:
    name: aegis-core-backend

server:
  port: ${PORT:8080}

aegis:
  ai-service:
    base-url: ${AEGIS_AI_SERVICE_URL:http://localhost:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
