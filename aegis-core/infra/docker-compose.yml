services:
  ai-service:
    build:
      context: ../ai-service
    container_name: aegis-ai-service
    ports:
      - "8090:8090"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    profiles:
      - ai

  prometheus:
    image: prom/prometheus:v2.53.2
    container_name: aegis-prometheus
    ports:
      - "9090:9090"
    profiles:
      - observability
