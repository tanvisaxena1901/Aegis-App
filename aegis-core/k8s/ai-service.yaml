apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-ai-service
  namespace: aegis
  labels:
    app.kubernetes.io/name: aegis
    app.kubernetes.io/component: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aegis
      app.kubernetes.io/component: ai-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegis
        app.kubernetes.io/component: ai-service
    spec:
      containers:
        - name: ai-service
          image: aegis-ai-service:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: AI_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: aegis-config
                  key: AI_PROVIDER
            - name: OPENAI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: aegis-config
                  key: OPENAI_MODEL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aegis-openai
                  key: OPENAI_API_KEY
                  optional: true
            - name: OLLAMA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: aegis-config
                  key: OLLAMA_BASE_URL
            - name: OLLAMA_MODEL
              valueFrom:
                configMapKeyRef:
                  name: aegis-config
                  key: OLLAMA_MODEL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-ai-service
  namespace: aegis
  labels:
    app.kubernetes.io/name: aegis
    app.kubernetes.io/component: ai-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aegis
    app.kubernetes.io/component: ai-service
  ports:
    - name: http
      port: 8090
      targetPort: http
