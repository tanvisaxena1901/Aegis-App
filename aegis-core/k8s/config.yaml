apiVersion: v1
kind: ConfigMap
metadata:
  name: aegis-config
  namespace: aegis
  labels:
    app.kubernetes.io/name: aegis
data:
  AEGIS_AI_SERVICE_URL: http://aegis-ai-service:8090
  AEGIS_RUNTIME_MEMORY_GRAPH: opensearch
  AEGIS_OPENSEARCH_BASE_URL: http://opensearch:9200
  AEGIS_OPENSEARCH_INDEX_PREFIX: aegis-runtime
  AI_PROVIDER: auto
  OPENAI_MODEL: gpt-4.1-mini
  OLLAMA_BASE_URL: http://ollama:11434
  OLLAMA_MODEL: qwen2.5:1.5b
